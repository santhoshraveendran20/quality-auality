<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a111f" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem('store-theme');
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>__STORE_TITLE__</title>
    <meta name="description" content="__STORE_DESCRIPTION__" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ta_IN" />
    <meta property="og:title" content="__STORE_TITLE__" />
    <meta property="og:description" content="__STORE_DESCRIPTION__" />
    <meta property="og:image" content="__STORE_OG_IMAGE__" />
    <meta name="twitter:card" content="summary_large_image" />
